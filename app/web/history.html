<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>历史会话 · 信贷建模工作台</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="history.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>历史会话</h1>
    <p>最近 50 次建模结果，点击会话 ID 可在建模页回放完整结果。</p>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">建模</a>
      <a href="data.html">数据与豁免</a>
      <a href="db.html">数据库挖掘</a>
      <a href="history.html" aria-current="page">历史会话</a>
    </nav>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite" class="status"></p>
    <div id="error" role="alert" class="error" hidden></div>

    <section aria-labelledby="sessions-title">
      <h2 id="sessions-title">会话列表</h2>
      <p id="empty-note" hidden>暂无历史会话。完成一次建模后会出现在这里。</p>
      <div class="table-wrap">
        <table id="sessions-table" hidden>
          <caption>按时间倒序排列的建模会话</caption>
          <thead><tr><th scope="col">时间</th><th scope="col">会话 ID</th><th scope="col">指令</th><th scope="col">卡种</th><th scope="col">跨期门禁</th><th scope="col">合规终审</th><th scope="col">操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
